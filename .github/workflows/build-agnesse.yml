name: Build AgNesse

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [ '21' ]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.83.0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only write to the cache for builds on the 'master' branch.
          # Builds on other branches will only read existing entries from the cache.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Build with Gradle
        run: ./gradlew build slimJar sourcesJar javadocJar
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libs-java-${{ matrix.java-version }}
          path: build/libs
      - name: Upload acceptance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-results
          path: build/reports/acceptance-results.json
          if-no-files-found: warn
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() }}
        with:
          files: build/test-results/test/*.xml
          check_run: false
          comment_mode: off
