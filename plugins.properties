##
# Port
#
# The port the server listens on.
# Defaults to 80. The -p command-line option overrides this.
#
#Port=8001

##
# RootPath
#
# Working directory.
# Defaults to '.'. The -d command-line option overrides this.
#
#RootPath=.

##
# FitNesseRoot
#
# Page root directory.
# Defaults to 'FitNesseRoot'. The -r command-line option overrides this.
#
#FitNesseRoot=FitNesseRoot

##
# LogDirectory
#
# When set, the server writes a log in this directory.
# When unset, the server does not write a log.
#
#LogDirectory=log

##
# MaximumWorkers
#
# Workers that handle incoming requests. Must be at least 5.
# Defaults to 100.
#
#MaximumWorkers=100

##
# Theme
#
# Page theme. Defaults to bootstrap.
#
#Theme=bootstrap

##
# Refactor.StartPath
#
# Shown on the move-page form as the path the new location is under.
# When unset, the form says ROOT.
#
#Refactor.StartPath=FrontPage
