##
# LogLevel
#
# Possible values are: verbose, normal
# Defaults to 'normal' if not configured.
#
#LogLevel=verbose

##
# Port
#
# Defines the port on which FitNesse will run.
# Defaults to '80' if not configured.
#
#Port=8001

##
# RootPath
#
# Working directory.
# Defaults to '.' if not configured.
#
#RootPath=.

##
# FitNesseRoot
#
# Page root directory.
# Defaults to 'FitNesseRoot' if not configured.
#
#FitNesseRoot=FitNesseRoot

##
# LogDirectory
#
# Log directory {no logging}
# Defaults to 'log' if not configured.
#
#LogDirectory=log

##
# OmittingUpdates
#
# Omit Updates
# Can be either true or false. Defaults to false if not configured.
#
#OmittingUpdates=true

##
#LocalhostOnly
#
# Only bind to loopback interface (localhost only access)
# Can be either true or false. Defaults to false if not configured.
#
#LocalhostOnly=true

##
# MaximumWorkers
#
# The maximum number of workers to use to handle incoming requests (must be at least 5).
# Defaults to '100' if not configured.
#MaximumWorkers=100

##
# Theme
#
# Themes can be used to customize the look and feel of the wiki.
# Build in theme include fitnesse_straight (the default), fitnesse_mint,
# fitnesse_topnav and bootstrap (based on the Twitter bootstrap front-end
# framework).
#
#Theme=bootstrap

##
# ContextRoot
#
# By default FitNesse is started at http://localhost:<port>/. With the context
# root parameter this can be changed to any root context.
# E.g. http://localhost:port/fitnesse, id ContextRoot = fitnesse
#
#ContextRoot=

##
# RecentChanges
#
# The component used to register wiki page changes. When using the GitFileVersionsController,
# also setting GitFileVersionsController as the RecentChanges component will give the
# Git change log. Also it will prevent updates on the RecentChanges wiki page, which will not
# be used then.
#
#RecentChanges=fitnesse.wiki.RecentChangesWikiPage

##
# TestSystems
#
# Define custom test systems. Test systems are created through a factory.
##
# Custom comparators
#
# Match test output in ways not foreseen.
CustomComparators=inverse:fitnesse.slim.test.InverseComparator

##
# The Path to start on for the tree selection when refactoring a page.
# The configured start path is selectable unless the default root path is used.
# When left empty, starts at the root path.
# Example values:
#  Refactor.StartPath=FrontPage
#  Refactor.StartPath=FitnesseRoot.FitNesse
#Refactor.StartPath=FitnesseRoot
