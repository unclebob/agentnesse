jacocoTestCoverageVerification {
  dependsOn test
  violationRules {
    coverageFloors.each { pkg, floors ->
      rule {
        element = 'PACKAGE'
        includes = [pkg]
        limit {
          counter = 'LINE'
          value = 'COVEREDRATIO'
          minimum = floors.line
        }
        if (floors.branch != null) {
          limit {
            counter = 'BRANCH'
            value = 'COVEREDRATIO'
            minimum = floors.branch
          }
        }
      }
    }
  }
}

def removedNamePatterns = file('config/removed-names.txt').exists() ?
  file('config/removed-names.txt').readLines().findAll { it.trim() && !it.trim().startsWith('#') } :
  []

task verifyRemoved {
  group = 'verification'
  description = 'Fail the build if a deleted name comes back in Java source.'
  doLast {
    def roots = [file('src'), file('test')]
    def failures = []
    roots.each { root ->
      if (!root.exists()) return
      fileTree(dir: root, include: '**/*.java').each { javaFile ->
        def text = javaFile.getText('UTF-8')
        removedNamePatterns.each { pattern ->
          if (text.contains(pattern)) {
            failures << "${javaFile}: contains '${pattern}'"
          }
        }
      }
    }
    if (!failures.isEmpty()) {
      throw new GradleException("Removed names reappeared:\n" + failures.join('\n'))
    }
  }
}

task verifyNoIgnoredTests {
  group = 'verification'
  description = 'Fail the build if a unit test is ignored or disabled.'
  doLast {
    def failures = []
    def root = file('test')
    if (root.exists()) {
      fileTree(dir: root, include: '**/*.java').each { javaFile ->
        def text = javaFile.getText('UTF-8')
        if (text.contains('@Ignore') || text.contains('@Disabled')) {
          failures << javaFile.path
        }
      }
    }
    if (!failures.isEmpty()) {
      throw new GradleException("Ignored or disabled tests are not allowed:\n" + failures.join('\n'))
    }
  }
}

check.dependsOn jacocoTestCoverageVerification, verifyRemoved, verifyNoIgnoredTests

pitest {
  targetClasses = ['fit.*', 'agnesse.*']
  pitestVersion = "1.30.1"
  threads = 1 // We can not deal with parallel execution yet
  outputFormats = ['XML', 'HTML']
}

task run(type: JavaExec) {
  dependsOn classes, copyRuntimeLibs
  classpath = sourceSets.main.runtimeClasspath
  mainClass = "agnesseMain.AgNesseMain"
  args "-p", "8001"
}

jar {
  dependsOn createUpdateLists
  into('Resources') {
    from('.') {
      include createUpdateLists.wikiFiles as String[]
    }
  }
  duplicatesStrategy = 'exclude'
  manifest {
    attributes("Main-Class": "agnesseMain.AgNesseMain",
        "Implementation-Version": archiveVersion)
  }
}

task standaloneJar(type: Jar) {
  duplicatesStrategy = 'include'
  dependsOn jar
  archiveBaseName = 'agnesse'
  archiveClassifier = 'standalone'
  from {
    configurations.runtimeClasspath.collect { zipTree(it) }
  } {
    exclude { FileTreeElement details ->
      details.relativePath.pathString.startsWith('META-INF/') &&
        !details.relativePath.pathString.equals('META-INF/services/org.slf4j.spi.SLF4JServiceProvider')
    }
  }
  from jar.outputs.files.collect {
    zipTree(it)
  }
  manifest {
    attributes("Main-Class": "agnesseMain.AgNesseMain",
        "Implementation-Version": archiveVersion)
  }
}

task slimJar(type: Jar) {
  dependsOn jar
  archiveBaseName = 'agnesse'
  archiveClassifier = 'slim'
  from { jar.outputs.files.collect { zipTree(it) } }
    {
    include 'agnesse/html/*.class'
    include 'agnesse/slim/**/*.class'
    include 'agnesse/socketservice/*.class'
    include 'util/*.class'
    include 'agnesse/util/StringUtils.class'
  }
  manifest {
    attributes("Implementation-Version": archiveVersion)
  }
}

task acceptanceTest(type: JavaExec) {
  dependsOn test, standaloneJar
  classpath = standaloneJar.outputs.files
  mainClass = "agnesseMain.AgNesseMain"
  args "-c", "AgNesse.SuiteAcceptanceTests?suite", "-b", "build/reports/acceptance-results.json"
}

task validateAcceptanceResults(type: JavaExec) {
  dependsOn acceptanceTest
  classpath = sourceSets.main.runtimeClasspath
  mainClass = "agnesse.results.SchemaCheck"
  args "build/reports/acceptance-results.json"
}

check.dependsOn validateAcceptanceResults

task javadocJar(type: Jar) {
  mustRunAfter check
  archiveClassifier = 'javadoc'
  from javadoc
}

task sourcesJar(type: Jar) {
  mustRunAfter check
  archiveClassifier = 'sources'
  duplicatesStrategy = 'include'
  from sourceSets.main.allSource
}

task releaseTag(type: Exec) {
  commandLine 'git', 'tag', project.version
  doLast {
    println "Tagged release ${project.version}"
  }
}

task publishTag(type: Exec) {
  commandLine 'git', 'push', '--tags'
  shouldRunAfter releaseTag
}

task release {
  dependsOn 'releaseTag', 'signAgNesseReleasePublication', 'publish', 'publishToSonatype', 'closeAndReleaseSonatypeStagingRepository', 'publishTag'
}

clean {
  delete "lib"
}

publishing {
  publications {
    AgNesseRelease(MavenPublication) {
      from components.java
      artifact sourcesJar
      artifact javadocJar
      artifact standaloneJar
      artifact slimJar
      groupId = 'org.agnesse'
      artifactId = 'agnesse'
      pom.withXml {
        asNode().get('version') + {
          resolveStrategy = Closure.DELEGATE_FIRST
          name('AgNesse')
          description('The fully integrated standalone wiki, and acceptance testing framework.')
          url('https://github.com/unclebob/agnesse')
          packaging('jar')
        }
        asNode().append(pomLicenses())
        asNode().append(pomScm())
        asNode().append(pomDevelopers())
      }
    }
  }
}

signing {
  sign publishing.publications
}


nexusPublishing {
  repositories {
    // see https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/#configuration
    sonatype {
      nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
      snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
    }
  }
}

wrapper {
  gradleVersion = '9.9.1'
}


def pomLicenses() {
  new NodeBuilder().licenses {
    license {
      name 'Common Public License version 1.0'
      url 'http://www.opensource.org/licenses/cpl1.0'
      distribution 'repo'
    }
  }
}

def pomScm() {
  new NodeBuilder().scm {
    connection 'scm:git:git://github.com/unclebob/agnesse.git'
    developerConnection 'scm:git:git@github.com:unclebob/agnesse.git'
    url 'https://github.com/unclebob/agnesse'
  }
}

def pomDevelopers() {
  new NodeBuilder().developers {
    developer {
      id 'unclebob'
      name 'Robert C. Martin'
      email 'unclebob@cleancoder.com'
    }
  }
}
