
/* Plan:
 - Create multi-module repo:
   - fit (deps: common)
   - slim (deps: common, networking)
   - common
   - networking
   - ant
   - agnesse, the wiki server
 - Move file creation to plugin
*/

buildscript {
    repositories {
      mavenCentral()
    }
    dependencies {
        classpath 'info.solidsoft.gradle.pitest:gradle-pitest-plugin:1.19.0'
    }
}

plugins {
  id 'java'
  id "maven-publish"
  id "io.github.gradle-nexus.publish-plugin" version "2.0.0"
  id 'signing'
  id "io.github.ben-manes.versions" version "0.67.0"
  id "groovy"
  id "info.solidsoft.pitest" version "1.19.0"
  id 'jacoco'
}

group = 'org.agnesse'
version = new Date().format('yyyyMMdd')

println "Building AgNesse v${project.version}..."

repositories {
  mavenCentral()
}

configurations {
  lesscss
  compile {
    transitive = false
  }
  runtime {
    transitive = false
  }
}

sourceSets {
  main {
    java.srcDir 'src'
    resources.srcDir 'src'
    output.resourcesDir = java.classesDirectory
  }
  test {
    java.srcDir 'test'
  }
}

java {
  toolchain {
    languageVersion.set(JavaLanguageVersion.of(21))
  }
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
  options.release.set(21)
}

dependencies {
  implementation "org.apache.velocity:velocity-engine-core:2.4.1"
  implementation "org.apache.commons:commons-lang3:3.21.0"
  implementation "org.slf4j:slf4j-api:2.0.20"
  implementation "org.slf4j:slf4j-jdk14:2.0.20"
  implementation "org.json:json:20260814"
  implementation "org.commonmark:commonmark:0.24.0"
  implementation "org.commonmark:commonmark-ext-gfm-tables:0.24.0"
  implementation "com.googlecode.java-diff-utils:diffutils:1.3.0"
  implementation "org.apache.commons:commons-text:1.15.0"
  implementation "org.codehaus.groovy:groovy-xml:3.0.25"

  compileOnly gradleApi()
  compileOnly "junit:junit:4.13.2"

  testImplementation gradleApi()
  testImplementation "junit:junit:4.13.2"
  testImplementation "net.javacrumbs.json-unit:json-unit:2.38.0"
  testImplementation "org.mockito:mockito-core:5.24.0"
  testImplementation "org.hamcrest:hamcrest-all:1.3"
  testImplementation "net.javacrumbs.json-unit:json-unit:2.40.1"

  lesscss "org.mozilla:rhino-tools:1.9.2"
}

task watchTemplates {
    group = 'development'
    description = 'Watch template files and copy them when changed'

    doLast {
        println "Starting template watcher..."
        println "Waiting for changes..."

        def templatesDir = file('src/agnesse/resources/templates')
        def lastModified = [:]

        // Initialize last modified times
        templatesDir.eachFileRecurse { file ->
            if (file.name.endsWith('.vm')) {
                lastModified[file.path] = file.lastModified()
            }
        }

        // Create a flag file to allow clean shutdown
        def flagFile = file('build/template-watcher.flag')
        flagFile.parentFile.mkdirs()
        flagFile.createNewFile()

        try {
            while (flagFile.exists() && !Thread.currentThread().isInterrupted()) {
                def hasChanges = false

                templatesDir.eachFileRecurse { file ->
                    if (file.name.endsWith('.vm')) {
                        def currentModified = file.lastModified()
                        def previousModified = lastModified[file.path] ?: 0

                        if (currentModified > previousModified) {
                            hasChanges = true
                            lastModified[file.path] = currentModified
                            println "Changed: ${file.name}"
                        }
                    }
                }

                if (hasChanges) {
                    println "Copying templates..."
                    copy {
                    from 'src/agnesse/resources/templates'
                    into 'build/classes/java/main/agnesse/resources/templates'
                        include '**/*.vm'
                    }
                    println "Templates copied. Waiting for changes..."
                }

                Thread.sleep(1000)
            }
        } finally {
            flagFile.delete()
            println "Template watcher stopped."
        }
    }
}

task stopTemplateWatcher {
    group = 'development'
    description = 'Stop the template watcher'

    doLast {
        def flagFile = file('build/template-watcher.flag')
        if (flagFile.exists()) {
            flagFile.delete()
            println "Template watcher stop signal sent."
        } else {
            println "Template watcher is not running."
        }
    }
}

task agNesseVersion {
  def versionFile = new File("${sourceSets.main.output.resourcesDir}/META-INF/AgNesseVersion.txt")
  outputs.file(versionFile)
  doLast {
    versionFile.parentFile.mkdirs()
    versionFile.text = "v${version}"
    println "agNesseVersion: ${outputs.files.singleFile.text}"
  }
}

task createUpdateLists(type: WikiFileListBuilderTask) {
  outputDirectory = "${sourceSets.main.output.resourcesDir}/Resources"

  files = {
    // Make sure only files in version control are added to the default wiki contents
    "git ls-files AgNesseRoot".execute().text.readLines()
  }

  doNotReplaceFiles = [
    "AgNesseRoot/_root.md",
    "AgNesseRoot/FrontPage.md",
    "AgNesseRoot/PageHeader.md",
    "AgNesseRoot/PageFooter.md",
    "AgNesseRoot/TemplateLibrary.md",
    "AgNesseRoot/TemplateLibrary/StaticPage.md",
    "AgNesseRoot/TemplateLibrary/SuitePage.md",
    "AgNesseRoot/TemplateLibrary/TestPage.md" ]
}

processResources.dependsOn "agNesseVersion", "createUpdateLists"

task copyRuntimeLibs(type: Copy) {
  into "lib"
  from configurations.runtimeClasspath
}

task javascriptTest(type: Exec) {
  group = 'verification'
  description = 'Run the suite summary renderer tests.'
  commandLine 'node', '--test', '--test-concurrency=1', 'test/agnesse/resources/javascript/suiteSummary.test.js', 'test/agnesse/resources/javascript/disclosure.test.js'
}

task pythonSlimTest(type: Exec) {
  group = 'verification'
  description = 'Run the guide Slim script and record its line coverage.'
  commandLine 'python3', 'test/agnesse/files/tiny_slim_test.py'
}

task goSlimTest(type: Exec) {
  group = 'verification'
  description = 'Run the Go Slim server tests.'
  workingDir = 'slim/go'
  commandLine 'go', 'test', '-count=1', '-timeout', '60s', './...'
}

task rustSlimTest(type: Exec) {
  group = 'verification'
  description = 'Run the Rust Slim server tests.'
  workingDir = 'slim/rust'
  commandLine 'cargo', 'test', '--offline', '--quiet'
}

task tsSlimTest(type: Exec) {
  group = 'verification'
  description = 'Run the TypeScript Slim server tests.'
  workingDir = 'slim/ts'
  commandLine 'npm', 'test'
}

task clojureSlimTest(type: Exec) {
  group = 'verification'
  description = 'Run the Clojure Slim server tests.'
  workingDir = 'slim/clj'
  commandLine 'clojure', '-M:test'
}

test {
  dependsOn copyRuntimeLibs, javascriptTest, pythonSlimTest, goSlimTest, rustSlimTest, tsSlimTest, clojureSlimTest
  maxParallelForks = 1
  finalizedBy jacocoTestReport
}

jacoco {
  toolVersion = "0.8.12"
}

jacocoTestReport {
  dependsOn test
  reports {
    csv.required = true
    xml.required = true
    html.required = true
  }
}

